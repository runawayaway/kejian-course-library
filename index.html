<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="西农课程资料与修课经验。找到课程、分享经验，也可以添加还没收录的课程。">
  <meta name="theme-color" content="#203c59"><title>课间 · 西农课程共享</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/upload.css"><link rel="stylesheet" href="assets/preview.css?v=preview1">
  <script src="data/courses.js" defer></script><script src="data/course-aliases.js" defer></script><script src="assets/community.js" defer></script><script src="assets/runtime-config.js?v=upload2" defer></script><script src="assets/data-service.js?v=upload2" defer></script><script src="assets/preview.js?v=preview1" defer></script><script src="assets/app.js?v=sync2" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-header"><div class="header-inner">
    <a href="#/" class="brand" aria-label="课间首页"><span class="brand-icon">课</span><span>课间<span class="brand-sub">西农课程共享</span></span></a>
    <nav aria-label="主导航"><a href="#/" data-nav="home">全部课程</a><a href="#/bookmarks" data-nav="bookmarks">我的收藏 <span id="bookmark-count">0</span></a></nav>
    <button class="button primary compact" data-add-course>＋ 添加课程</button>
  </div></header>
  <main id="main" tabindex="-1"></main>
  <footer><a href="#/" class="footer-brand">课间</a><span>资料有出处，经验有接力。</span><button class="text-button" id="manage-access">管理</button><a href="https://github.com/runawayaway/NWAFU-coursework-experimental-report" target="_blank" rel="noopener noreferrer">资料来源</a></footer>
  <dialog id="contribution-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title">写经验</h2><button class="icon-button" id="close-dialog" aria-label="关闭">×</button></div>
    <form id="contribution-form">
      <label id="course-select-field">课程<select name="course" required></select></label>
      <label id="course-name-field" hidden>课程名称<input name="name" maxlength="100" placeholder="例如：计算机图形学"></label>
      <label id="file-field" hidden>选择文件<input name="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.tsv,.txt,.md,.zip,.ipynb,.c,.cpp,.h,.java,.py,.sql,.r,.js,.json"><span class="form-note" id="file-hint">支持文档、表格、代码或 ZIP 文件。</span></label>
      <label id="content-field"><span id="content-label">你的经验</span><textarea name="content" rows="5" maxlength="3000" placeholder="学习建议、授课方式、考核要求，都可以写在这里。"></textarea></label>
      <details id="context-fields"><summary>补充教师与学期（可选）</summary><div class="form-grid"><label>教师<input name="teacher" maxlength="40" placeholder="不清楚可留空"></label><label>学期<input name="semester" maxlength="40" placeholder="例如：2025–2026 春季"></label></div></details>
      <p class="form-note">直接保存到网站，无需 GitHub。本设备发布的内容可直接修改，请只上传有权公开的内容。</p>
      <div class="form-actions"><button class="button primary" type="submit">保存</button></div>
      <div id="submission-result" role="status" hidden></div>
    </form>
  </dialog>
  <dialog id="admin-dialog" aria-labelledby="admin-title"><form id="admin-form"><div class="dialog-head"><h2 id="admin-title">维护者权限</h2><button class="icon-button" type="button" id="close-admin" aria-label="关闭管理">×</button></div><p class="form-note">普通投稿无需登录。管理密钥仅用于维护历史资料和其他人的内容，请勿分享给访客。</p><label>管理密钥<input name="key" type="password" autocomplete="off" required></label><div class="form-actions"><button class="button primary" type="submit">启用管理</button></div><p id="admin-error" role="alert"></p></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body></html>
