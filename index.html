<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="以课程为中心，整理学习资料、修课经验与课程问答。让每一份学习经验，都有下一位读者。">
  <meta name="theme-color" content="#203c59"><title>课间 · 校园课程共享计划</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css">
  <script src="data/courses.js" defer></script><script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-header"><div class="header-inner">
    <a href="#/" class="brand" aria-label="课间首页"><span class="brand-icon">课</span><span>课间<span class="brand-sub">校园课程共享计划</span></span></a>
    <nav aria-label="主导航"><a href="#/" data-nav="home">发现课程</a><a href="#/bookmarks" data-nav="bookmarks">我的收藏 <span id="bookmark-count">0</span></a><a href="#/guide" data-nav="guide">共建指南</a></nav>
    <button class="button primary compact" id="header-contribute"><span aria-hidden="true">＋</span> 贡献一份经验</button>
  </div></header>
  <main id="main" tabindex="-1"></main>
  <footer><a href="#/" class="footer-brand">课间</a><span>让知识留下，让后来者少走弯路。</span><span>学生共建 · 开放共享 · 持续更新</span></footer>
  <dialog id="contribution-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><div><span class="small-label">一起完善课程资料库</span><h2 id="dialog-title">分享你的学习收获</h2></div><button class="icon-button" id="close-dialog" aria-label="关闭">×</button></div>
    <p class="muted">填写后生成投稿文稿，通过 GitHub Issue 提交，维护者审核后更新网站。</p>
    <form id="contribution-form">
      <div class="form-grid"><label>贡献类型<select name="type"><option value="experience">修课经验</option><option value="resource">分享资料</option><option value="question">课程提问</option><option value="answer">回答问题</option><option value="feedback">纠错反馈</option></select></label><label>所属课程<select name="course" required></select></label></div>
      <label>标题<input name="title" required maxlength="100" placeholder="例如：容器实验中容易忽略的三个问题"></label>
      <div class="form-grid"><label>学期<input name="semester" required maxlength="40" placeholder="2026 秋季"></label><label>授课教师<input name="teacher" required maxlength="40" placeholder="请填写教师；不适用可填写「不适用」"></label></div>
      <label>具体内容<textarea name="content" required minlength="10" maxlength="12000" rows="5" placeholder="写下学习建议、考核情况、问题详情或纠正内容（至少 10 字）"></textarea></label>
      <div id="resource-fields" hidden><label>资料链接<input name="url" type="url" placeholder="https://…"></label><div class="form-grid"><label>资料来源<input name="source" maxlength="200" placeholder="原创 / 作者与出处"></label><label>分享权限<select name="permission"><option>仅提供原始链接</option><option>原创，允许公开分享</option><option>已获得作者授权</option></select></label></div></div>
      <p class="form-note">请勿提交未经授权的课件、个人信息或未公开的试题。示例课程仅供演示，投稿前请核实课程与学期。</p>
      <div class="form-actions"><button class="button secondary" type="button" id="download-draft">下载 Markdown</button><button class="button primary" type="submit">生成投稿文稿</button></div>
      <div id="submission-result" hidden aria-live="polite"></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body></html>
